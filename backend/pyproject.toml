[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "integration: marks tests as integration tests",
    "neo4j: marks tests that require Neo4j database",
    "slow: marks tests as slow running",
]

[tool.pytest]
asyncio_mode = "auto"
